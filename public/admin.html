<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学涯 · 云端管理</title>
<style>:root{font-family:system-ui;color:#302e2a;background:#f8f7f4}body{max-width:980px;margin:40px auto;padding:0 24px}h1{font-family:serif;font-weight:500}small,p{color:#7e7a72}form,section{padding:24px;border:1px solid #e8e4dc;border-radius:18px;margin:22px 0;background:#fffefa}input,button,select{font:inherit;padding:12px;border:1px solid #e8e4dc;border-radius:10px}button{cursor:pointer;background:#302e2a;color:white}input{max-width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:14px 8px;border-bottom:1px solid #e8e4dc}#error{color:#b65f41}.scroll{overflow:auto}#status{line-height:2}</style>
<h1>学涯 / 云端管理</h1><p>真实账号、套餐与服务状态。管理凭据仅在当前页面内存中使用。</p>
<form id="login"><label>管理凭据 <input id="token" type="password" required autocomplete="off"></label> <button>连接后台</button></form><p id="error" role="alert"></p>
<section id="dashboard" hidden><h2>服务状态</h2><p id="status"></p><button id="refresh">刷新</button><h2>最近注册的用户</h2><div class="scroll"><table><thead><tr><th>邮箱</th><th>注册时间</th><th>设备</th><th>套餐</th></tr></thead><tbody id="users"></tbody></table></div></section>
<script>
let token='';const error=document.getElementById('error');async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||d.message||'连接失败');return d;}
async function load(){try{error.textContent='';const [d,h]=await Promise.all([api('/api/admin/overview'),fetch('/healthz').then(r=>r.json())]);document.getElementById('dashboard').hidden=false;document.getElementById('status').textContent=`数据库：${d.database} · 用户：${d.userCount} · 学习引擎：${h.status} · 真实 AI：${h.aiConfigured?'已配置':'待配置'} · 对象存储：${d.storageConfigured?'已配置':'未启用'}`;const rows=document.getElementById('users');rows.replaceChildren();for(const u of d.users){const tr=document.createElement('tr');for(const value of [u.email,new Date(u.created_at).toLocaleString(),u.devices]){const td=document.createElement('td');td.textContent=value;tr.append(td);}const td=document.createElement('td'),select=document.createElement('select');for(const p of ['free','pro']){const option=new Option(p,p,p===u.plan,p===u.plan);select.add(option);}select.onchange=async()=>{select.disabled=true;try{await api('/api/admin/users/plan',{email:u.email,plan:select.value});await load();}catch(e){error.textContent=e.message;select.value=u.plan;}finally{select.disabled=false;}};td.append(select);tr.append(td);rows.append(tr);}}catch(e){error.textContent=e.message;}}
document.getElementById('login').onsubmit=e=>{e.preventDefault();token=document.getElementById('token').value;document.getElementById('token').value='';load();};document.getElementById('refresh').onclick=load;
</script></html>
