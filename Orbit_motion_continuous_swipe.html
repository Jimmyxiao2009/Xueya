/* A continuous, progressively softer backdrop behind the floating title. */
.app-header{top:0;left:0;right:0;min-height:108px;padding:calc(30px + env(safe-area-inset-top)) 25px 18px;border:0;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
.app-header>.subject-switch,.app-header>.header-orbit{position:relative;z-index:1}
.app-header>.subject-switch{pointer-events:auto}
.app-header>.header-orbit{background:none}
.header-blur{position:absolute;inset:0 0 -48px;pointer-events:none}
.header-blur::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(248,247,244,.86) 0%,rgba(248,247,244,.55) 38%,rgba(248,247,244,.18) 70%,rgba(248,247,244,0) 100%)}

.header-blur>i:nth-child(1){--blur:2px;--from:72%;--to:100%}
.header-blur>i:nth-child(2){--blur:4px;--from:54%;--to:88%}
.header-blur>i:nth-child(3){--blur:8px;--from:36%;--to:72%}
.header-blur>i:nth-child(4){--blur:16px;--from:18%;--to:55%}
.header-blur>i:nth-child(5){--blur:28px;--from:0%;--to:38%}
@media(max-width:360px){.app-header{padding-left:20px;padding-right:20px}}

/* Keep the roadmap visible while its selected course opens into a full screen. */
.lesson-underlay,.lesson-opening{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--bg);transform-origin:center center}
.lesson-underlay{z-index:25;pointer-events:none}
.lesson-underlay *{pointer-events:none!important}
.lesson-opening{z-index:26;will-change:clip-path}
.lesson-opening .todo{animation:none}
.course-top h1:focus{outline:none}
@media(prefers-reduced-motion:reduce){.lesson-opening{will-change:auto}}
.lesson-revealed .todo{animation:idle-tile 8s 1s ease-in-out infinite}.lesson-revealed .todo:nth-child(even){animation-delay:-3s}

/* Ambient motion has its own layer; pressing never restarts its clock. */
.node-buoy,.label-buoy{display:block;pointer-events:none;transform-origin:center;will-change:transform}
.node-buoy{display:grid;place-items:center}
.label-buoy{width:100%}
.node-hit .node{animation:none;transform:rotate(-5deg);transition:scale .28s var(--spring),filter .25s}
.info-face{animation:none;transform:none;transition:scale .28s var(--spring)}
.node-hit.tap-released .node,.stop-info.tap-released .info-face{animation:course-release .42s ease-out}

   const baseAtD=lead+q/(1+q/(width*1.85));

   const qe=Math.max(0,detentEnd-lead);
