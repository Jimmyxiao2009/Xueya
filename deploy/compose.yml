name: orbit-demo

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_DB: orbit
      POSTGRES_PASSWORD: ${ORBIT_DB_PASSWORD:?Set database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orbit -d orbit]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *default-logging
  cloud:
    image: orbit-demo-cloud:local
    build:
      context: ../cloud
      dockerfile: Dockerfile
    environment:
      VERRUCKT_ENV: ${VERRUCKT_ENV:-production}
      VERRUCKT_BIND: 0.0.0.0
      VERRUCKT_PORT: 8080
      DATABASE_URL: postgres://orbit:${ORBIT_DB_PASSWORD}@postgres:5432/orbit
      VERRUCKT_ACCESS_TOKEN_SECRET: ${VERRUCKT_ACCESS_TOKEN_SECRET:?Set token secret}
      ORBIT_ADMIN_TOKEN: ${ORBIT_ADMIN_TOKEN:?Set admin token}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
  web:
    image: orbit-demo:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      VERRUCKT_CLOUD_URL: http://cloud:8080
      ORBIT_PUBLIC_ORIGIN: ${ORBIT_PUBLIC_ORIGIN:-http://127.0.0.1:1420}
      ORBIT_AI_BASE_URL: ${ORBIT_AI_BASE_URL:-}
      ORBIT_AI_API_KEY: ${ORBIT_AI_API_KEY:-}
      ORBIT_AI_MODEL: ${ORBIT_AI_MODEL:-}
      ORBIT_AI_PROTOCOL: ${ORBIT_AI_PROTOCOL:-chat_completions}
      ORBIT_EMBEDDING_MODEL: ${ORBIT_EMBEDDING_MODEL:-text-embedding-3-small}
      ORBIT_BRAVE_API_KEY: ${ORBIT_BRAVE_API_KEY:-}
    ports:
      - "${ORBIT_HTTP_BIND:-127.0.0.1}:${ORBIT_HTTP_PORT:-1420}:1430"
    volumes:
      - learning:/data
    depends_on:
      cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1430/healthz | grep -q 'aiConfigured.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
volumes:
  postgres:
  learning:
