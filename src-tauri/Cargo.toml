[package]
name = "verruckt"
version = "0.1.0-rc.1"
description = "Local-first BYOK AI self-study workbench."
authors = ["Verruckt"]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
default-run = "verruckt"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-window-state"]
web-server = ["dep:axum", "dep:tower-http"]

[[bin]]
name = "orbit-server"
path = "src/bin/orbit-server.rs"
required-features = ["web-server"]

[[bin]]
name = "verruckt"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "verruckt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The MSVC linker prints a progress line to stdout for the cdylib/staticlib
# artefacts, which rustc 1.9x reports as a linker_messages warning. It is noise,
# not a problem with the crate.
[lints.rust]
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
regex = "1"
pdf-extract = "0.12"
zip = "2"
quick-xml = "0.37"
keyring = "4"
ring = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-window-state = { version = "2", optional = true }
verruckt-vector = { path = "../crates/verruckt-vector" }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
